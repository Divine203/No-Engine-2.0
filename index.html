<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
    <script src="./libs/gl-matrix.min.js"></script>
</head>

<body>

    <canvas id="c" width="1200" height="700"></canvas>

    <script id="objVertexShader" type="x-shader/x-vertex">
        #version 300 es 
        in vec3 position;
        in vec2 textureCoordinate;
        in vec3 normal;

        out vec2 ftextureCoordinate;
        out vec4 vertexWorldPosition;
        out vec3 vertexNormal;

        uniform vec3 offsets;

        uniform mat4 modelMatrix;
        uniform mat4 viewMatrix;
        uniform mat4 projectionMatrix;

        void main() {
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position.x + offsets[gl_InstanceID],position.yz, 1);
            vertexWorldPosition = modelMatrix * vec4(position.x + offsets[gl_InstanceID],position.yz, 1);
            ftextureCoordinate = textureCoordinate;
            // vertexNormal = mat3(modelMatrix) * normal;
            vertexNormal = mat3(transpose(inverse(modelMatrix))) * normal; // fix normal on scales
        }
    </script>
    <script id="objFragmentShader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;

        in vec2 ftextureCoordinate;
        uniform sampler2D sampler0;

        uniform vec3 lightColor;
        uniform vec3 lightPosition;

        uniform vec3 cameraPosition;

        out vec4 finalColor;

        in vec4 vertexWorldPosition;
        in vec3 vertexNormal;

        void main() {
            vec3 lightDirection = normalize(lightPosition - vec3(vertexWorldPosition));
            vec3 viewDirection = normalize(cameraPosition - vec3(vertexWorldPosition));

            vec4 objectColor = vec4(.4, .4, .4, 1);

            vec3 normalizedNormal = normalize(vertexNormal);

            float ambientIntensity = 0.7;

            vec4 tex = texture(sampler0, ftextureCoordinate); // vec4
            vec3 litRGB = ambientIntensity * lightColor * tex.rgb;

            vec4 ambientComponent = vec4(litRGB, tex.a);

            float diffuseIntensity = max(dot(normalize(vertexNormal), lightDirection), 0.0);
            vec4 diffuseComponent = vec4(diffuseIntensity * lightColor, 1.0);

            vec3 reflectedLightDirection = reflect(-lightDirection, normalizedNormal);

            float specularIntensity = pow(max(dot(reflectedLightDirection, viewDirection),0.0),32.0);
            vec4 specularComponent = vec4(specularIntensity * lightColor, 1.0);

            finalColor = (ambientComponent + diffuseComponent + specularComponent) * objectColor;
        }
    </script>



    <script id="lightVertexShader" type="x-shader/x-vertex">
        #version 300 es 
        in vec3 position;

        uniform vec3 offsets;

        uniform mat4 modelMatrix;
        uniform mat4 viewMatrix;
        uniform mat4 projectionMatrix;

        void main() {
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position.x + offsets[gl_InstanceID],position.yz, 1);
        }
    </script>
    <script id="lightFragmentShader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;

        uniform vec4 color;
        out vec4 finalColor;

        void main() {
            finalColor = 10.0 * color;
        }
    </script>

    <script src="global.js"></script>
    <script src="controls.js"></script>
    <script src="utils.js"></script>
    <script src="light.js"></script>
    <script src="model.js"></script>
    <script src="cube.js"></script>
    <script src="plain.js"></script>
    <script src="scene.js"></script>
    <script src="obj.js"></script>
    <script src="main.js"></script>
</body>

</html>
